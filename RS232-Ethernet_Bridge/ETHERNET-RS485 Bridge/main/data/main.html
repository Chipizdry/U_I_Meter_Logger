

<!DOCTYPE html>
<html>
<head>
    <link rel="icon" type="image/png" href="/favicon.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>COR-Bridge Control Panel</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <div class="container">
        <!-- === Форма входа === -->
        <form id="loginForm">
            <h2>Авторизация</h2>
            <label>Login:</label>
            <input name="login" type="text" required placeholder="Введите логин"><br><br>
            <label>Password:</label>
            <input name="password" type="password" required placeholder="Введите пароль"><br><br>
            <button type="submit">Войти</button>
        </form>

        <!-- === Основной экран (Wi-Fi настройки) === -->
        <div id="mainScreen" class="hidden">

            <!-- === Кнопка гамбургера === -->
            <div id="menuButton">☰</div>
        
            <!-- === Боковая панель меню === -->
            <div id="sideMenu" class="side-menu">
                <h3>Настройки</h3>
                <button class="menu-item active" data-tab="account">🔐Учётная запись</button>
                <button class="menu-item" data-tab="LAN">🌐 Сетевые настройки</button>
                <button class="menu-item" data-tab="wifi">📡 Wi-Fi</button>
                <button class="menu-item" data-tab="user">👤 Пользователь</button>
                <button class="menu-item" data-tab="system">⚙️ Система</button>
                <hr>
                <button id="logoutBtn">🚪 Выйти</button>
            </div>
        
            <!-- === Основная рабочая область === -->
            <div id="mainContent" class="content">
        
                <!-- Wi-Fi -->
                <div class="tab-content active" id="wifi">
                    <h2>Wi-Fi настройки</h2>
                    <form id="wifiForm" method="POST" action="/save_settings">
                        <label>Mode:
                            <select name="mode">
                                <option value="STA">STA</option>
                                <option value="AP">AP</option>
                                <option value="STA_AP">STA+AP</option>
                            </select>
                        </label><br>

                        <label>SSID: <input type="text" name="ssid"></label><br>
                        <label>Password: <input type="password" name="password"></label><br>
                       
                       
                        <button type="submit">💾 Сохранить</button>
                    </form>
                </div>
        
                <!-- Пользователь -->
                <div class="tab-content" id="user">
                    <h2>Пользователь</h2>
                    <label>Имя пользователя:</label>
                    <input type="text" value="admin"><br>
                    <label>Пароль: <input type="password" name="user-password"></label><br>
                    <label>Повторить пароль: <input type="password" name="confirm-user-password"></label><br>
                    <button>💾 Изменить</button>
                </div>
        
                <!-- Система -->
                <div class="tab-content" id="system">
                    <h2>Системные параметры</h2>
                    <label>Интервал обновления (мс):</label>
                    <input type="number" value="1000"><br>
                    <label>Режим отладки:</label>
                    <input type="checkbox"> Включить<br>
                    <label>Язык интерфейса:</label>
                    <select>
                        <option>RU</option>
                        <option>EN</option>
                        <option>ZH</option>
                    </select><br>

                    <button>💾 Сохранить</button>

                      <!-- 🔹 Версия сборки -->
                     
                        <div class="card-body">
                            <span class="build-icon">⚙️</span>
                            <span id="buildInfoText">Build #— • —</span>
                        </div>
                   
                </div>


                <!-- Учётная запись -->
                <div class="tab-content" id="account">
                    <h2>Учётная запись</h2>
                    <label>Login: <input type="text" name="user-login" required></label><br>
                    <label>Password: <input type="password" name="account-password"></label><br>
                    <button>Тест</button>
                    <button>💾 Сохранить</button>
                   
                </div>


                 <!-- Сетевые настройки -->
                 <div class="tab-content" id="LAN">
                    <h2>Параметры сети</h2>
                    <form id="lanForm" class="settings-form">

                        <label class="switch-label">
                            <input type="checkbox" id="dhcp" name="dhcp">
                            <span class="switch"></span>
                            Включить DHCP
                        </label>

                        <label for="ip">IP адрес:</label>
                        <input type="text" id="ip" name="ip" placeholder="192.168.001.100" required><br>
                
                        <label for="mask">Маска подсети:</label>
                        <input type="text" id="mask" name="mask" placeholder="255.255.255.000" required><br>
                
                        <label for="gateway">Шлюз:</label>
                        <input type="text" id="gateway" name="gateway" placeholder="192.168.001.001" required><br>
                
                        <label for="dns">DNS сервер:</label>
                        <input type="text" id="dns" name="dns" placeholder="008.008.008.008"><br>
                
                        <label for="port">Порт:</label>
                        <input type="number" id="port" name="port" min="1" max="65535" value="80" required><br>
                
                        <button type="submit">💾 Сохранить</button>
                    </form>
                </div>
        
            </div>
        </div>
    </div>

    <script src="/script.js"></script>
</body>
</html>
